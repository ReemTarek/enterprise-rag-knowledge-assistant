name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # global.json pins SDK 11.0.100 (a stable version number). If the GA SDK is
      # not yet served by setup-dotnet, add `dotnet-quality: preview` here.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Includes architecture tests; Testcontainers uses the runner's Docker.
      - name: Test
        run: dotnet test -c Release --no-build

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/enterprise-rag-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/enterprise-rag-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  # Full stack: SQL Server (service container) -> migrations -> API (Release) -> Angular dev server -> Chromium.
  # scripts/e2e-stack.mjs --ci migrates and starts the API (with the E2E-only raised auth rate limits) and generates
  # the E2E admin credentials into the git-ignored e2e/.auth/stack.env.json; Playwright starts the dev server.
  # The database is fresh per run: the service container is ephemeral.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [build-test, frontend]
    timeout-minutes: 30
    env:
      # CI-only THROWAWAY SA password, not a secret: the SQL container exists only for this job, listens only on the
      # runner and holds only generated test data. Service containers cannot read step outputs/$GITHUB_ENV, so a
      # value generated in a step cannot reach MSSQL_SA_PASSWORD; it is derived from the run id instead (differs per
      # run) and masked in the first step. Keep it identical to services.sqlserver.env.MSSQL_SA_PASSWORD below.
      CI_SA_PASSWORD: E2e-${{ github.run_id }}-Strong!1
      E2E_API_URL: http://127.0.0.1:5180
      E2E_DB_NAME: EnterpriseRagE2e
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    services:
      sqlserver:
        # Same tag as docker-compose.yml.
        image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: E2e-${{ github.run_id }}-Strong!1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    defaults:
      run:
        working-directory: frontend/enterprise-rag-web
    steps:
      - name: Mask the throwaway SA password
        working-directory: .
        run: echo "::add-mask::$CI_SA_PASSWORD"

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/enterprise-rag-web/package-lock.json

      - name: Restore .NET tools
        working-directory: .
        run: dotnet tool restore

      - name: Install
        run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium (and OS dependencies)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS dependencies (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start the stack (migrate, API in Release)
        run: |
          # Per-run JWT signing key, masked before anything can print it; the admin passwords are generated by the
          # script into e2e/.auth/stack.env.json (never printed) and masked below.
          JWT_KEY="$(openssl rand -base64 48)"
          echo "::add-mask::$JWT_KEY"
          export Jwt__SigningKey="$JWT_KEY"
          export Database__ConnectionString="Server=127.0.0.1,1433;Database=${E2E_DB_NAME};User Id=sa;Password=${CI_SA_PASSWORD};TrustServerCertificate=True"
          nohup node scripts/e2e-stack.mjs --ci > "$RUNNER_TEMP/e2e-stack.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/e2e-stack.pid"

      - name: Wait for the API (/health/ready, max 180 s)
        run: |
          pid="$(cat "$RUNNER_TEMP/e2e-stack.pid")"
          for i in $(seq 1 180); do
            if grep -q "stack ready" "$RUNNER_TEMP/e2e-stack.log" \
              && curl -fsS -o /dev/null "$E2E_API_URL/health/ready"; then
              node -e "const c=require('./e2e/.auth/stack.env.json');for(const k of ['adminPassword','adminNewPassword'])console.log('::add-mask::'+c[k])"
              echo "Stack ready after ${i} s."
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::e2e-stack exited before the API became ready."
              tail -n 100 "$RUNNER_TEMP/e2e-stack.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::The API did not answer 200 on /health/ready within 180 s."
          tail -n 100 "$RUNNER_TEMP/e2e-stack.log"
          exit 1

      - name: Run the E2E suite
        env:
          CI: "true"
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/enterprise-rag-web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results (traces, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/enterprise-rag-web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e-stack.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/e2e-stack.pid")" 2>/dev/null || true
            sleep 3
          fi
          cp "$RUNNER_TEMP/e2e-stack.log" e2e-stack.log 2>/dev/null || true

      - name: Upload stack log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-log
          path: frontend/enterprise-rag-web/e2e-stack.log
          retention-days: 7
          if-no-files-found: ignore
